site_name: concept-graph-xai
site_description: "Concept-graph aware visualisation of model feature usage and importance, with concept-level ablation and design diagnostics."
site_url: https://wlazlod.github.io/concept-graph-xai/
repo_url: https://github.com/wlazlod/concept-graph-xai
repo_name: wlazlod/concept-graph-xai

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Tour: tour.md
  - Getting Started: getting-started.md
  - User Guide:
    - Concept Graphs: user-guide/concept-graphs.md
    - What does my model rely on?: user-guide/structure.md
    - How does the signal compose?: user-guide/composition.md
    - Why this prediction?: user-guide/per-prediction.md
    - Is my concept tree any good?: user-guide/concept-design.md
    - Does importance differ across cohorts?: user-guide/cohort.md
    - Where does the model behave differently across protected groups?: user-guide/fairness.md
    - What if data goes missing or drifts?: user-guide/robustness.md
  - API Reference:
    - api/index.md
    - ConceptGraph: api/graph.md
    - Adapters: api/adapters.md
    - Counts: api/metrics-counts.md
    - Importance: api/metrics-importance.md
    - Utilization: api/metrics-utilization.md
    - Ablation: api/metrics-ablation.md
    - Correlation: api/metrics-correlation.md
    - Missingness: api/metrics-missingness.md
    - Coherence: api/metrics-coherence.md
    - Plotting: api/plotting.md
  - Roadmap: roadmap.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: spacy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            signature_crossrefs: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/wlazlod/concept-graph-xai
