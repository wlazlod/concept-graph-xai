site_name: concept-graph-xai
site_description: "Concept-graph aware visualisation of model feature usage and importance, with concept-level ablation and design diagnostics."
site_url: https://wlazlod.github.io/concept-graph-xai/
repo_url: https://github.com/wlazlod/concept-graph-xai
repo_name: wlazlod/concept-graph-xai

strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: spacy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            signature_crossrefs: true
            show_signature_annotations: true
  - mkdocs-jupyter:
      include: ["notebooks/*.ipynb"]
      ignore: ["*.md"]  # keep jupytext's pandoc probe away from mkdocstrings ::: directives
      execute: false  # notebook is committed executed

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - How it works: how-it-works.md
  - Concepts:
      - Concept graphs: concepts/concept-graphs.md
      - What does my model rely on?: concepts/structure.md
      - How does the signal compose?: concepts/composition.md
      - Why this prediction?: concepts/per-prediction.md
      - Is my concept tree any good?: concepts/concept-design.md
      - Does importance differ across cohorts?: concepts/cohort.md
      - Where does the model differ across protected groups?: concepts/fairness.md
      - How often does data actually go missing?: concepts/missing-values.md
      - What if data goes missing or drifts?: concepts/robustness.md
  - Tutorials:
      - Credit-risk walkthrough: notebooks/01_credit_risk_walkthrough.ipynb
  - API reference: api.md
  - FAQ: faq.md
