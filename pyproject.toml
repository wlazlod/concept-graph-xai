[project]
name = "concept-graph-xai"
version = "0.6.1"
description = "Concept-graph aware visualisation of model feature usage and importance, with concept-level ablation metrics."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Daniel Wlazlo", email = "wlazlo.daniel@gmail.com" }]
requires-python = ">=3.12"
keywords = ["xai", "shap", "interpretability", "ontology", "sunburst", "feature-importance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "networkx>=3.2",
    "plotly>=5.20",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
shap = ["shap>=0.45"]
lightgbm = ["lightgbm>=4.3"]
xgboost = ["xgboost>=2.0"]
png = ["kaleido>=0.2.1,<1"]
notebook = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "kagglehub>=0.3",
    "shap>=0.45",
    "lightgbm>=4.3",
    "kaleido>=0.2.1,<1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.0",
    "kaleido>=0.2.1,<1",
    "shap>=0.45",
    "lightgbm>=4.3",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "pymdown-extensions>=10.9",
]

[project.urls]
Homepage = "https://github.com/wlazlod/concept-graph-xai"
Documentation = "https://wlazlod.github.io/concept-graph-xai/"
Issues = "https://github.com/wlazlod/concept-graph-xai/issues"
Changelog = "https://github.com/wlazlod/concept-graph-xai/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/concept_graph_xai"]

[tool.hatch.build.targets.sdist]
include = [
    "src/concept_graph_xai",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["examples", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["N803", "N806", "RUF001", "RUF002"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/concept_graph_xai"]

[[tool.mypy.overrides]]
module = ["plotly.*", "shap.*", "lightgbm.*", "xgboost.*", "kagglehub.*", "networkx.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error", "ignore::DeprecationWarning"]
